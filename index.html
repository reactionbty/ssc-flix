<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>SSC Flix — Exam Portal</title>
  <link rel="stylesheet" href="/ssc-flix/style.css?v=20261105-debug3">
  <style>
    .app-boot-loader,.app-boot-error{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;text-align:center;color:#1b2435;background:#f5f7fb;font:14px system-ui,sans-serif}
    .app-boot-spinner{width:28px;height:28px;border:3px solid #dedcf0;border-top-color:#6254d9;border-radius:50%;animation:app-boot-spin .8s linear infinite}
    .app-boot-error h1{margin:0;font-size:20px}.app-boot-error p{max-width:420px;margin:0;color:#687386;line-height:1.55}
    .app-boot-error button{min-height:42px;padding:0 18px;border:0;border-radius:9px;background:#6254d9;color:#fff;font-weight:700}
    @keyframes app-boot-spin{to{transform:rotate(360deg)}}
  </style>
  <script>
    window.__SSC_FLIX_BOOT = { scriptLoaded: false, scriptStarted: false, rendered: false, stage: 'html-loaded', error: '' };
    (function () {
      var root;
      function showBootError(message) {
        root = root || document.getElementById('app');
        if (!root || !root.querySelector('.app-boot-loader')) return;
        root.innerHTML = '<main class="app-boot-error"><h1>SSC Flix could not start</h1><p>' +
          String(message || 'The app did not finish loading. Please reload the page.') +
          '</p><button type="button" onclick="window.location.reload()">Reload website</button></main>';
      }
      window.__SSC_FLIX_SHOW_BOOT_ERROR = showBootError;
      window.addEventListener('error', function (event) {
        var boot = window.__SSC_FLIX_BOOT;
        if (event && (event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement)) {
          boot.error = 'asset-load-error';
          boot.stage = 'asset-load-error';
          showBootError('The browser could not load ' + (event.target.src || event.target.href || 'a website file') + '. Check your connection or content blocker, then reload.');
        } else if (event && event.message) {
          boot.error = event.message;
          boot.stage = 'javascript-error';
          showBootError('JavaScript startup error: ' + event.message);
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var boot = window.__SSC_FLIX_BOOT;
        boot.error = String(event && event.reason || 'Unhandled promise rejection');
        boot.stage = 'promise-error';
        showBootError('Website startup error: ' + boot.error);
      });
      window.setTimeout(function () {
        var boot = window.__SSC_FLIX_BOOT || {};
        if (boot.rendered) return;
        var message = !boot.scriptLoaded
          ? 'The SSC Flix JavaScript file did not finish loading. Check your connection, browser content blocker, or VPN, then reload.'
          : !boot.scriptStarted
            ? 'The JavaScript file loaded, but the app did not begin executing. Try disabling content blockers for this site and reload.'
            : 'The app started running but did not finish its first render. ' + (boot.error || 'Reload the page to try again.');
        boot.stage = 'startup-timeout';
        showBootError(message);
      }, 12000);
    })();
  </script>
  <script src="/ssc-flix/script.js?v=20261105-debug3" onload="window.__SSC_FLIX_BOOT.scriptLoaded=true" onerror="window.__SSC_FLIX_BOOT.error='script-request-failed';window.__SSC_FLIX_SHOW_BOOT_ERROR('The SSC Flix JavaScript file could not be loaded. Check your connection or browser content blocker.')" defer></script>
</head>
<body>
  <div id="app" aria-live="polite"><div class="app-boot-loader"><span class="app-boot-spinner"></span><strong>Loading SSC Flix…</strong></div></div>
</body>
</html>
